name: Build release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keys/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests (parsers)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        id: apk
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          OUT="upi-ledger-v$V.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: upi-ledger-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" --title "UPI Ledger $TAG" --notes "Signed release APK built by GitHub Actions from commit ${{ github.sha }}."
          fi
