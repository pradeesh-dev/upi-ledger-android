name: Build release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        if: ${{ env.KEYSTORE_PASSWORD != '' }}
        run: |
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore/upi-ledger-release.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=upiledger" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "Release signing enabled"
      - name: Warn when unsigned
        if: ${{ env.KEYSTORE_PASSWORD == '' }}
        run: echo "::warning::KEYSTORE_PASSWORD secret not set - APK will be signed with a throwaway debug key"

      - name: Unit tests (parsers)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        id: apk
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          OUT="upi-ledger-v$V.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: upi-ledger-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" --title "UPI Ledger $TAG" --notes "Signed release APK built by GitHub Actions from commit ${{ github.sha }}."
          fi
